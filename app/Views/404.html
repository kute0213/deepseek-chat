<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
<title>页面不存在 · DSW</title>
<link rel="stylesheet" href="/static/site/ui.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .top { padding: 28px 40px; }

  .brand {
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
  }

  .main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 24px 64px;
    text-align: center;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    width: min(560px, 90vw);
    height: min(560px, 90vw);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(57, 100, 254, 0.18), rgba(57, 100, 254, 0) 68%);
    filter: blur(8px);
    pointer-events: none;
  }

  .code {
    position: relative;
    margin: 0 0 6px;
    font-size: clamp(88px, 17vw, 152px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.06em;
    background: linear-gradient(180deg, var(--brand), color-mix(in srgb, var(--brand) 25%, transparent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    position: relative;
    margin: 0;
    font-size: clamp(20px, 3vw, 26px);
    font-weight: 600;
    line-height: 1.4;
  }

  .desc {
    position: relative;
    max-width: 420px;
    margin: 12px 0 0;
    color: var(--text-2);
    font-size: 15px;
    line-height: 1.7;
  }

  .actions {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 32px;
  }

  @media (max-width: 480px) {
    .top { padding: 22px 20px; }
    .main { padding-bottom: 48px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .code, h1, .desc, .actions {
      animation: rise 0.2s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    h1 { animation-delay: 0.05s; }
    .desc { animation-delay: 0.1s; }
    .actions { animation-delay: 0.15s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">DSW</a>
</header>
<main class="main">
  <div class="glow" aria-hidden="true"></div>
  <p class="code" aria-hidden="true">404</p>
  <h1>页面不存在</h1>
  <p class="desc">你访问的页面可能已被移动或删除，请检查链接是否正确。</p>
  <div class="actions">
    <a class="btn primary" href="/">返回首页</a>
    <button class="btn" type="button" id="back">返回上一页</button>
  </div>
</main>
<script>
  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) {
      history.back()
    } else {
      location.href = '/'
    }
  })
</script>
</body>
</html>
