# =====================================================================
# DeepSeek Web · 虚拟主机版 Nginx 配置
#
# 适用：宝塔 / aaPanel / 小皮 / cPanel(Nginx) / 自建 LNMP 等虚拟主机环境
# 要求：站点根目录必须是「包含 index.php 的那一层项目根」；
#       PHP 8.1+；首次访问 /install 完成初始化。
#
# 两种用法，按主机权限二选一：
#   A. 只能填「伪静态 / 重写规则」→ 复制【一、伪静态规则】整段
#   B. 可以直接编辑站点 server 块 → 参考【二、完整 server 块】
#
# 虚拟主机面板通常已接管 SSL、root、index 与 PHP-FPM，
# 因此伪静态版只补充「路由 + 防护 + 缓存 + 上传超时」。
# =====================================================================


# =====================================================================
# 一、伪静态规则（粘贴到面板「伪静态」输入框，整段复制）
#     超出面板行数限制时，可先删掉「上传体积与超时」那几行，
#     改为在面板「PHP 配置 / 站点配置」里设置 128M、900s。
# =====================================================================

# ---------- 上传体积与超时：导入历史 / 大附件 / 长回复 ----------
client_max_body_size       128m;
client_body_timeout        900s;
send_timeout               900s;
fastcgi_read_timeout       900s;
fastcgi_send_timeout       900s;
fastcgi_buffering          off;   # 流式回复必须关闭缓冲
fastcgi_request_buffering  off;   # 大文件上传边收边转发

# ---------- 内部目录与隐藏文件禁止直接访问 ----------
location ~ ^/(app|uploads|frontend|scripts)(/|$) {
    deny all;
}
location ~ /\.(?!well-known) {
    deny all;
}

# ---------- 统一入口：安装 / 文档 / 管理后台 / 分享 / 旧协议 / 404 ----------
location = /install      { rewrite ^ /index.php last; }
location = /install.php  { rewrite ^ /index.php last; }
location = /terms        { rewrite ^ /index.php last; }
location = /terms.html   { rewrite ^ /index.php last; }
location = /404.html     { rewrite ^ /index.php?_r=/404 last; }
location = /docs         { rewrite ^ /index.php last; }
location ^~ /docs/       { rewrite ^ /index.php last; }
location = /admin        { rewrite ^ /index.php last; }
location ^~ /admin/      { rewrite ^ /index.php last; }
location = /share        { rewrite ^ /index.php last; }
location ^~ /share/      { rewrite ^ /index.php last; }

# ---------- 静态资源缓存（构建产物文件名带 hash，可长期缓存） ----------
location ^~ /static/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}
# ---------- 网站图标：一年缓存，避免 AI / 浏览器反复请求造成 404 与回源 ----------
location = /favicon.ico {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files /static/site/favicon.ico =404;
}
location = /static/site/favicon.ico {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location = /static/site/favicon.png {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
# 站点静态资源（图标、后台样式），位于构建目录的 site 子目录
location ^~ /static/site/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
location = /static/site/ui.css {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}
location = /index.html {
    add_header Cache-Control "no-store";
}

# ---------- 其余请求交给唯一入口（SPA / API） ----------
location / {
    try_files $uri /index.php$is_args$args;
}

# ---------- 统一 404（由 PHP 输出站点样式的错误页） ----------
error_page 404 /index.php?_r=/404;


